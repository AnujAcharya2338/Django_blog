{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}

<div class="row">
   {% include 'dashboard/sidebar.html' %}
    

    <div class="col-md-9">
        <h3>Add New Categories</h3>

        <form action="{% url 'add_categories' %}" method="post" style="width: 500px;">
            {% csrf_token %}
            {{form | crispy }}
            <button type="submit" class="btn btn-warning">Submit</button>
        </form>
    </div>
    <br>
</div>

{% endblock %}
