{% extends 'base.html' %}

{% block content %}

<div class="row">
    <div class="col-md-3">
        <div class="nav flex-column nav-pills bg-light" aria-orientation="vertical"></div>
        <a href="" class="nav-link text-dark ">Dashboard</a>
        <a href="" class="nav-link text-dark ">Categories</a>
        <a href="" class="nav-link text-dark ">Posts</a>
        <a href="" class="nav-link text-dark ">Logout</a>
    </div>

    <div class="col-md-9">
        <div class="row">
            <div class="col">
                <div class="card border-default mb-3">
                    <div class="card-header text-center text-uppercase font-weight-bold">All categories</div>
                    <div class="card-body text-dark"> 
                        <h5 class="card-title text-center">{{ category_count }}</h5>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card border-default mb-3">
                    <div class="card-header text-center text-uppercase font-weight-bold">All Posts</div>
                    <div class="card-body text-dark"> 
                        <h5 class="card-title text-center">{{ blog_count }}</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock%}
