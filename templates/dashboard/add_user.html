{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}

<div class="row">
   {% include 'dashboard/sidebar.html' %}
    

    <div class="col-md-9">
      {% if perms.auth.view_users %}

        <h3>Add New Users</h3>

        <form action="{% url 'add_user'  %}" method="post" style="width: 500px;" >
            {% csrf_token %}
            {{form | crispy }}
            <button type="submit" class="btn btn-warning">Submit</button>
        </form>
        {%else%}
<h5>You do not have permission to view this page.</h5>

        {%endif%}
    </div>
    <br>
</div>
               
{% endblock %}
